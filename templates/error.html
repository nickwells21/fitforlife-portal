{% extends 'base.html' %}
{% block title %}{{ code }} — Fit For Life{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-code">{{ code }}</div>
  <div style="font-size:15px; font-weight:600; color:var(--text); margin-top:0.75rem; margin-bottom:0.5rem;">{{ message }}</div>
  <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary" style="margin-top:1rem;">← Back to Dashboard</a>
</div>
{% endblock %}
